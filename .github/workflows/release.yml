name: Release

# Started by .github/release/release.sh with reviewed notes. Like the file it
# writes, CHANGELOG.md is an output: the release commit adds the notes to it on
# top of the checked main commit, the tag points at that commit, the GitHub
# release gets the same notes, and a pull request brings the changelog to main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version, such as v1.2.3
        required: true
        type: string
      commit:
        description: Full SHA of the checked main commit
        required: true
        type: string
      notes:
        description: Release notes, as Markdown
        required: true
        type: string
      dry_run:
        description: Show the changelog it would write without tagging or publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  COMMIT: ${{ inputs.commit }}
  NOTES: ${{ inputs.notes }}

jobs:
  release:
    if: github.repository == 'fschrhunt/pure.nvim'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require that main has not moved
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Dispatch releases from main.' >&2; exit 1; }
          [ "$COMMIT" = "$GITHUB_SHA" ] || { echo 'Main changed after the release was requested; retry.' >&2; exit 1; }
      - name: Check the tag and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/release/verify.sh "$TAG" "$COMMIT"
      - name: Write the changelog
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo 'The release notes are empty.' >&2; exit 1; }
          .github/release/changelog.sh "$TAG" "$RUNNER_TEMP/notes.md"
          git diff
      - name: Tag and publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -qm "release: $TAG" -- CHANGELOG.md
          git tag -a "$TAG" -m "$TAG"
          branch="release/$TAG"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "refs/tags/$TAG" "HEAD:refs/heads/$branch"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh pr create --base main --head "$branch" --title "release: $TAG" \
            --body "Adds the $TAG notes to CHANGELOG.md. The $TAG tag already points at this commit; merge after CI passes."
          # Pushes made with the automatic token don't start CI; request it for the PR's commit.
          gh workflow run ci.yml --ref "$branch"
